name: Deploy Eisenhower PWA to VPS

on:
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_DIR: /opt/eisenhower-pwa
      SERVICE_NAME: eisenhower-pwa
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate JavaScript
        run: |
          node --check server.js
          node --check public/app.js
          node --check public/watch.js

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload files
        run: |
          rsync -az --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".env" \
            --exclude "data/tasks.json" \
            --exclude "node_modules/" \
            -e "ssh -i ~/.ssh/deploy_key -p $VPS_PORT" \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:$APP_DIR/"

      - name: Restart service
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'EOF'
            set -e
            cd /opt/eisenhower-pwa
            mkdir -p data
            npm install --omit=dev
            sudo chown -R www-data:www-data data
            sudo systemctl restart eisenhower-pwa
            sleep 2
            sudo systemctl --no-pager --full status eisenhower-pwa
          EOF

      - name: Health check
        run: |
          curl -fsS "https://${{ secrets.APP_DOMAIN }}/api/health"
