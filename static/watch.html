<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff5ed">
  <title>Eisenhower Watch</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    :root {
      color-scheme: light;
      --bg: #f2d9ce;
      --surface: #fff8ef;
      --text: #292420;
      --muted: #8f7e72;
      --line: rgba(83, 52, 38, 0.12);
      --coral: #ff765d;
      --teal: #86dcd3;
      --lime: #cfe985;
      --yellow: #ffd178;
      --shadow: 0 12px 26px rgba(117, 76, 54, 0.16);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 20% 0%, rgba(255, 255, 255, 0.44), transparent 34%),
        linear-gradient(135deg, #efd1c4, #f7e6dc 52%, #f1d8cc);
      color: var(--text);
    }

    main {
      width: min(100vw - 18px, 380px);
      margin: 0 auto;
      padding: max(10px, env(safe-area-inset-top)) 0 max(10px, env(safe-area-inset-bottom));
      display: grid;
      gap: 10px;
    }

    .watch-card {
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: var(--shadow);
      padding: 10px;
      display: grid;
      gap: 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(18px, 6.4vw, 28px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .status {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.25;
    }

    button,
    input,
    select {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.78);
      color: var(--text);
      font: inherit;
      padding: 0 10px;
    }

    button {
      cursor: pointer;
      font-weight: 800;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .tile {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      min-height: 74px;
      display: grid;
      align-content: center;
      gap: 4px;
      text-align: left;
    }

    .tile.active {
      outline: 3px solid rgba(41, 36, 32, 0.3);
      outline-offset: -4px;
    }

    .tile strong {
      font-size: 22px;
      line-height: 1;
    }

    .tile span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.15;
    }

    .do {
      background: linear-gradient(135deg, #ff765d, #f4b6ab);
    }

    .plan {
      background: linear-gradient(135deg, #7ed9d1, #d8f3df);
    }

    .delegate {
      background: linear-gradient(135deg, #b8df69, #f3e9bf);
    }

    .delete {
      background: linear-gradient(135deg, #ffc45d, #ffe5bd);
    }

    form {
      display: grid;
      gap: 8px;
    }

    .quick-row {
      display: grid;
      grid-template-columns: 46px 1fr;
      gap: 8px;
    }

    .record {
      width: 46px;
      min-height: 42px;
      padding: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #ffbf5d, #ff735e);
      border-color: rgba(255, 255, 255, 0.62);
      box-shadow: 0 8px 14px rgba(255, 118, 93, 0.18);
    }

    .record::before {
      content: "";
      width: 16px;
      height: 20px;
      display: block;
      background: currentColor;
      -webkit-mask:
        radial-gradient(circle at 50% 31%, #000 0 5px, transparent 5.5px),
        linear-gradient(#000 0 0) 50% 15px / 9px 2px no-repeat,
        linear-gradient(#000 0 0) 50% 16px / 2px 7px no-repeat,
        linear-gradient(#000 0 0) 50% 100% / 11px 2px no-repeat;
      mask:
        radial-gradient(circle at 50% 31%, #000 0 5px, transparent 5.5px),
        linear-gradient(#000 0 0) 50% 15px / 9px 2px no-repeat,
        linear-gradient(#000 0 0) 50% 16px / 2px 7px no-repeat,
        linear-gradient(#000 0 0) 50% 100% / 11px 2px no-repeat;
    }

    .record.recording {
      background: #ef4d3b;
      color: white;
    }

    .list-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .task-list {
      display: grid;
      gap: 8px;
      max-height: 220px;
      overflow: auto;
      padding-right: 2px;
    }

    .task {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.72);
      padding: 9px;
      display: grid;
      gap: 7px;
    }

    .task strong {
      font-size: 13px;
      line-height: 1.22;
      overflow-wrap: anywhere;
    }

    .task-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .task-actions button {
      min-height: 32px;
      padding: 0 6px;
      font-size: 12px;
    }

    .small {
      min-height: 36px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <section class="watch-card">
    <header>
      <h1>Manage Your Work</h1>
      <p class="status" id="status">Ładuję...</p>
    </header>

    <section class="grid" aria-label="Liczniki zadań">
      <button class="tile do active" type="button" data-zone="do"><strong id="countDo">0</strong><span>Zrób teraz</span></button>
      <button class="tile plan" type="button" data-zone="plan"><strong id="countPlan">0</strong><span>Zaplanuj</span></button>
      <button class="tile delegate" type="button" data-zone="delegate"><strong id="countDelegate">0</strong><span>Deleguj</span></button>
      <button class="tile delete" type="button" data-zone="delete"><strong id="countDelete">0</strong><span>Usuń</span></button>
    </section>

    <section aria-label="Zadania">
      <div class="list-head">
        <span id="activeZoneLabel">Zrób teraz</span>
        <span id="visibleCount">0 zadań</span>
      </div>
      <div class="task-list" id="taskList"></div>
    </section>

    <form id="quickForm">
      <div class="quick-row">
        <button class="record" id="recordButton" type="button" aria-label="Dyktuj zadanie"></button>
        <input id="taskInput" autocomplete="off" placeholder="Krótka notatka">
      </div>
      <select id="zoneInput">
        <option value="do">Zrób teraz</option>
        <option value="plan">Zaplanuj</option>
        <option value="delegate">Deleguj</option>
        <option value="delete">Usuń</option>
      </select>
      <button class="small" type="submit">Dodaj</button>
    </form>

    <button class="small" id="settingsButton" type="button">Ustawienia</button>
    </section>
  </main>

  <script src="./watch.js"></script>
</body>
</html>
