<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff5ed">
  <title>Eisenhower Watch</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    :root {
      color-scheme: light;
      --bg: #f2d9ce;
      --surface: #fff8ef;
      --text: #292420;
      --muted: #8f7e72;
      --line: rgba(83, 52, 38, 0.12);
      --shadow: 0 12px 26px rgba(117, 76, 54, 0.16);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 24% 0%, rgba(255, 255, 255, 0.5), transparent 34%),
        linear-gradient(135deg, #efd1c4, #f7e6dc 52%, #f1d8cc);
      color: var(--text);
    }

    main {
      width: min(100vw - 14px, 380px);
      margin: 0 auto;
      padding: max(8px, env(safe-area-inset-top)) 0 max(8px, env(safe-area-inset-bottom));
      display: grid;
      gap: 8px;
    }

    .watch-card {
      border: 1px solid rgba(255, 255, 255, 0.76);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: var(--shadow);
      padding: 10px;
      display: grid;
      gap: 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(17px, 6vw, 24px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .status {
      min-height: 16px;
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.2;
    }

    button {
      border: 1px solid var(--line);
      color: var(--text);
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .record-main {
      min-height: 70px;
      border-radius: 18px;
      background: linear-gradient(135deg, #ffbf5d, #ff735e);
      border-color: rgba(255, 255, 255, 0.72);
      box-shadow: 0 10px 18px rgba(255, 118, 93, 0.2);
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 900;
    }

    .record-main.recording,
    .zone-mic.recording {
      background: #ef4d3b;
      color: white;
      animation: pulse 1s ease-in-out infinite;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .tile {
      min-height: 92px;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr 40px;
      gap: 8px;
      align-items: center;
    }

    .tile strong {
      display: block;
      font-size: 28px;
      line-height: 1;
    }

    .tile span {
      display: block;
      margin-top: 5px;
      color: rgba(41, 36, 32, 0.66);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.12;
    }

    .zone-mic {
      width: 40px;
      min-height: 40px;
      border-radius: 999px;
      padding: 0;
      background: rgba(255, 255, 255, 0.58);
      display: grid;
      place-items: center;
    }

    .mic-icon {
      width: 16px;
      height: 20px;
      display: block;
      background: currentColor;
      -webkit-mask:
        radial-gradient(circle at 50% 31%, #000 0 5px, transparent 5.5px),
        linear-gradient(#000 0 0) 50% 15px / 9px 2px no-repeat,
        linear-gradient(#000 0 0) 50% 16px / 2px 7px no-repeat,
        linear-gradient(#000 0 0) 50% 100% / 11px 2px no-repeat;
      mask:
        radial-gradient(circle at 50% 31%, #000 0 5px, transparent 5.5px),
        linear-gradient(#000 0 0) 50% 15px / 9px 2px no-repeat,
        linear-gradient(#000 0 0) 50% 16px / 2px 7px no-repeat,
        linear-gradient(#000 0 0) 50% 100% / 11px 2px no-repeat;
    }

    .do {
      background: linear-gradient(135deg, #ff765d, #f4b6ab);
    }

    .plan {
      background: linear-gradient(135deg, #7ed9d1, #d8f3df);
    }

    .delegate {
      background: linear-gradient(135deg, #b8df69, #f3e9bf);
    }

    .delete {
      background: linear-gradient(135deg, #ffc45d, #ffe5bd);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(0.96); }
    }

    @media (max-height: 360px) {
      main {
        width: min(100vw - 10px, 380px);
        padding-top: 5px;
        padding-bottom: 5px;
      }

      .watch-card {
        border-radius: 18px;
        padding: 8px;
        gap: 7px;
      }

      h1 {
        font-size: 18px;
      }

      .status {
        display: none;
      }

      .record-main {
        min-height: 54px;
        border-radius: 14px;
        font-size: 16px;
      }

      .grid {
        gap: 6px;
      }

      .tile {
        min-height: 76px;
        border-radius: 14px;
        padding: 8px;
        grid-template-columns: 1fr 34px;
      }

      .tile strong {
        font-size: 24px;
      }

      .tile span {
        font-size: 11px;
      }

      .zone-mic {
        width: 34px;
        min-height: 34px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="watch-card">
      <header>
        <h1>Manage Your Work</h1>
        <p class="status" id="status">Ładuję...</p>
      </header>

      <button class="record-main" id="recordButton" type="button" data-record-zone="">
        Nagraj
      </button>

      <section class="grid" aria-label="Kwadraty">
        <article class="tile do">
          <div><strong id="countDo">0</strong><span>Zrób teraz</span></div>
          <button class="zone-mic" type="button" data-record-zone="do" aria-label="Nagraj do Zrób teraz"><span class="mic-icon"></span></button>
        </article>
        <article class="tile plan">
          <div><strong id="countPlan">0</strong><span>Zaplanuj</span></div>
          <button class="zone-mic" type="button" data-record-zone="plan" aria-label="Nagraj do Zaplanuj"><span class="mic-icon"></span></button>
        </article>
        <article class="tile delegate">
          <div><strong id="countDelegate">0</strong><span>Deleguj</span></div>
          <button class="zone-mic" type="button" data-record-zone="delegate" aria-label="Nagraj do Deleguj"><span class="mic-icon"></span></button>
        </article>
        <article class="tile delete">
          <div><strong id="countDelete">0</strong><span>Usuń</span></div>
          <button class="zone-mic" type="button" data-record-zone="delete" aria-label="Nagraj do Usuń"><span class="mic-icon"></span></button>
        </article>
      </section>
    </section>
  </main>

  <script type="module" src="./watch.js"></script>
</body>
</html>
